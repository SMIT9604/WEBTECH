<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="task.css">
</head>
<body>
    <div class="card">
        <h1>Age Calculator</h1>
        <div class="input-group">
            <label for="dob">Select your Date of Birth</label>
            <input type="date" id="dob" >
        </div>
        <button onclick="calculateAge()">Calculate Age</button>
        <div id="displayAge" class="result"></div>
    </div>
    <script>
        function calculateAge(){
            let userDob = document.getElementById("dob").value;

            let userDate = new Date(userDob)

            let userYear = userDate.getFullYear();

            let todayDate = new Date();
            let todayYear = todayDate.getFullYear();

            if (todayYear < userYear){
                alert("Enter valid year");
            }
            else{
                age=todayYear - userYear;
                console.log(age);
                document.getElementById("displayAge").innerText = `Your Age is : ${age}`;
            }
        }
    </script>
</body>
</html>
