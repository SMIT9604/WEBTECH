<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width: 300px;
            height: 300px;
            border-radius: 50%;
            border: 2px solid red;
            text-align: center;
            line-height: 300px;
        }
        #box1{
            background-image: radial-gradient(red,orange,yellow);
        }
        #box2{
            background-image: radial-gradient(#085078,#85d8ce);
        }
    </style>
</head>
<body>
    <h1>Radial Gradient In HTML</h1>
    <div class="box" id="box1">Circle-1</div>
    <div class="box" id="box2">Circle-2</div>
    <div class="box" id="box3">Circle-3</div>
</body>
</html>
