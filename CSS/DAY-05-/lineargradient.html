<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width:600px ;
            height: 250px;
            border:1px solid gray ;
            margin: 50px auto;

        }
        #box1{
            background-image: linear-gradient(to bottom,red,blue);
        }
        #box2{
            background-image: linear-gradient(to right,yellow,green);
        }
        #box3{
            background-image: linear-gradient(to bottom right,red,blue,yellow);
        }
        #box4{
            background-image: repeating-linear-gradient(red 10%,green 20%,aqua 30%);
        }
        #box5{
            background-image: linear-gradient(rgb(255, 60, 0) 33%,white 33% 66%,green 66%);
        }
    </style>
</head>
<body>
    <h1>Linear Gradient In HTML</h1>
    <div class="box" id="box1">Box-1</div>
    <div class="box" id="box2">Box-2</div>
    <div class="box" id="box3">Box-3</div>
    <div class="box" id="box4">Box-4</div>
    <div class="box" id="box5"><img src="" alt=""></div>
</body>
</html>
