<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="output.css">
    <title>Document</title>
</head>
<body>
    <section class="w-full h-screen flex justify-center items-center ">
        <article class="w-[80%] h-[80%] border rounded-lg flex ">
            <aside class="w-[50%] h-full rounded-l-lg">
                <img  src="https://png.pngtree.com/png-clipart/20190924/original/pngtree-flat-illustration-of-group-working-png-image_4833344.jpg" alt="" class="object-cover" >
            </aside>
            <aside class="w-[50%] h-full bg-blue-700 rounded-r-lg flex justify-center items-center">
                <form class="w-[50%] h-[60%] bg-white rounded-lg p-10 ">
                    <h1 class="text-2xl font-bold">Hello!</h1>
                    <p class="text-gray-700">Sign up to get started</p>
                    <div class="my-6 relative">
                        <div class="my-6 relative">
                            <input type="email" placeholder="Email Address" name="" id="" class="border border-gray-400 rounded-full placeholder:text-sm outline-none pl-10 py-2">
                        </div>
                        <div class="mb-6">
                            <input type="password" placeholder="Password" name="" id="" class="border border-gray-400 rounded-full placeholder:text-sm outline-none pl-10 py-2">
                        </div>
                        <div class="">
                            <button class="border bg-blue-600 w-full rounded-full text-white py-2.5">Login</button>
                            <a class="hover:underline hover:text-blue-900" href="">Forget password</a>
                        </div>
                    </div>
                </form>
            </aside>
        </article>
    </section>
</body>
</html>
