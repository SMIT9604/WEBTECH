<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent{
            width: 100%;
            height: 200px;
            background-color: beige;
            display: flex;
            justify-content:space-evenly ;
            align-items: center;
        }
            
            .box{
                width: 100px;
                height: 100px;
                background-color: black;
                color: white;
                border-radius: 2px;
                display: flex;
                justify-content: center;
                align-items: center;
                border: 2px solid;
            }
            #box-3{
                flex-grow: 3;
                flex-shrink: 2;
            }
            #box-4{
                align-self: flex-end;
            }
            #box-2{
                align-self: flex-start;
            }
            

    </style>
</head>
<body>
     <h1>Flex grow and flex shrink Child Property in Flex Box</h1>
    <div class="parent">
    <div class="box" id="box-1">Box-1</div>
    <div class="box" id="box-2">Box-2</div>
    <div class="box" id="box-3">Box-3</div>
    <div class="box" id="box-4">Box-4</div>
    <div class="box" id="box-5">Box-5</div>
    </div>
</body>
</html>
