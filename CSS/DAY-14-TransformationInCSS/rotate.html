<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent{
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            
        }
        .box{
            width: 200px;
            height: 150px;
            border: 1px solid;
           display: flex;
           justify-content: center;
           align-items: center;
           background-color: yellow;
        }
        #box1:hover{
            transform: rotateZ(45deg);
            background-color: green;
            transition: all 0.3s ease-in-out;
        }
         #box2:hover{
            transform: rotateX(45deg);
            background-color: green;
             transition: all 0.3s ease-in-out;
        }
         #box3:hover{
            transform: rotateY(45deg);
            background-color: green;
             transition: all 0.3s ease-in-out;
        }
    </style>
</head>
<body>
    <h1>Transform:Rotate</h1>
    <br>
    <br>
    <br>
    <div class="parent">
        <div class="box" id="box1">Rotate-Z</div>
        <div class="box" id="box2">Rotate-X</div>
        <div class="box" id="box3">Rotate-Y</div>
    </div>
</body>
</html>
