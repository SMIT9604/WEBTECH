<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Areas</title>
    <style>
        *{
            padding: 0px;
            margin: 0px;
        box-sizing: border-box;       
     }
     .parent{
        width: 100%;
        height: 100vh;
        background-color: black;
        display: grid;
        grid-template-areas:
        "head head head"
        "side sec sec"
        "side main main"
        "foot foot foot"
         ;
     }
     .child{
        background-color: wheat;
        padding: 20px;
        border:1px solid black;
        display: flex;
        justify-content: center;
        align-items: center;

     }
     #item1{
        grid-area: head;
     }
     #item2{
        grid-area: side;
     }
     #item3{
        grid-area: sec;
     }
     #item4{
        grid-area: main;
     }
     #item5{
        grid-area: foot;
     }
    </style>
</head>
<body>
    <section class="parent">
        <div class="child" id="item1">Header</div>
        <div class="child" id="item2">Aside</div>
        <div class="child" id="item3">Section</div>
        <div class="child" id="item4">Main</div>
        <div class="child" id="item5">Footer</div>
    </section>
</body>
</html>
