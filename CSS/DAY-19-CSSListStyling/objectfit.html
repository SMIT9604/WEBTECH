<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Object Fit Property</title>
    <style>
        div{
            width: 200px;
            height: 200px;
            border: 1px solid black;
        }
        .bgimage{
            background-image: url(/HTML/assets/shubman.png);
            background-position: center;
            background-size: cover;
        }
        .image{
            width: 200px;
            height: 200px;
            object-fit: cover;
            object-position: center;
        }
        img{
             width: 200px;
            height: 200px;
        }
    </style>
</head>
<body>
    <section>
        <div class="bgimage"><h1></h1></div>
        <div class="image"><img  src="/HTML/assets/shubman.png" alt=""></div>
    </section>
</body>
</html>
