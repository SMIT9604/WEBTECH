<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .mainsection{
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 50% auto;
             border: 2px solid red;
             gap: 20px;
        }
        .main{
           width: 100%;
           height: 100px;
           border: 2px solid black;
           justify-content: center;
           align-content: center;
           align-items: center;
           text-align: center;
        }
    </style>
</head>
<body>
    <section class="mainsection">
        <div class="main" id="box1">Box-1</div>
        <div class="main" id="box2">Box-2</div>
        <div class="main" id="box3">Box-3</div>
        <div class="main" id="box4">Box-4</div>
        <div class="main" id="box5">Box-5</div>
        <div class="main" id="box6">Box-6</div>
        <div class="main" id="box7">Box-7</div>
        <div class="main" id="box8">Box-8</div>
        <div class="main" id="box9">Box-9</div>
        <div class="main" id="box10">Box-10</div>
    </section>
</body>
</html>
