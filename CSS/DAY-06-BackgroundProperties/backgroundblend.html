<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width: 600px;
            height: 200px;
            background-image: url(http://www.pixelstalk.net/wp-content/uploads/2016/08/Best-Cars-Full-HD-Photos-1920x1080.jpg);
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            background-color: rgba(0,0,0,0.7);
        }
        .box:hover{
            background-blend-mode: hard-light;
        }
    </style>
</head>
<body>
    <h1>Background Blend Mode in CSS</h1>
    <div class="box"></div>
</body>
</html>
