<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Racing</title>
    <style>
        .parent{
            width: 100%;
            height: 500px;
            display: grid;
           
            
        }
        .child{
            margin: auto;
            width: 80%;
            height: 60px;
            background-image: url(https://as2.ftcdn.net/v2/jpg/03/22/04/13/1000_F_322041300_t2B2LhdtaMTLzlLnym9mLo17G8D4lOZV.jpg);
            border: 1px solid;
            background-size: cover;
            position: relative;
            
        }
        img{
            width: 100px;
            height: 60px;
            position: absolute;
            animation: driveCars 10s forwards;
            
        }
        @keyframes driveCars{
            from{
                right:10px 
            }
            to{    
                right:calc(90% - 10px)  
            }
        }
       #car1{
        animation-timing-function: linear;
       }
       #car2{
        animation-timing-function: ease;
       }
       #car3{
        animation-timing-function: ease-in;
       }
       #car4{
        animation-timing-function: ease-out;
       }
       #car5{
        animation-timing-function: ease-in-out;
       }
    </style>
</head>
<body>
    <h1><center>Car Racing (f1)</center></h1>
    <section class="parent">
        <div class="child"><img id="car1" src="/HTML/assets/cars/car1.jpg" alt=""></div>

        <div class="child"><img  id="car2" src="/HTML/assets/cars/car2.jpg" alt=""></div>

        <div class="child" ><img id="car3" src="/HTML/assets/cars/car3.jpg" alt=""></div>

        <div class="child" ><img id="car4" src="/HTML/assets/cars/car6.jpg" alt=""></div>

        <div class="child" ><img id="car5" src="/HTML/assets/cars/car5.jpg" alt=""></div>
    </section>
</body>
</html>
