<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task of avengers</title>
</head>

<style>

    *{
        margin: 0px;
        text-align: center;
    }

    #headsection{
        width: 100%;
        height: 90px;
        background-image: url(/HTML/assets/avengerslogo.webp);
        background-position: center;
        background-repeat: no-repeat;
        background-size: cover;
    }

    #head_para{
        margin: 50px; 
    }

    #section2{
        margin: 50px;
        height: 480px;
        border: 2px solid black;
        background-color: gray;
    }

    .box{
        margin: 15px;
        width: 300px;
        height: 200px;
        display: inline-block;
        border: 2px solid black;
        background-position: center;
        background-repeat: no-repeat;
        background-size: cover;
        

    }
    #box1{
        background-image: url(https://wallpapercave.com/wp/aubS8pB.jpg);
    }
    #box2{
        background-image: url(https://wallpapercave.com/wp/wp1809046.jpg);
    }
    #box3{
        background-image: url(http://www.hdwallpapersfreedownload.com/uploads/large/super-heroes/hulk-desktop-hd.jpg);
    }
    #box4{
        background-image: url(https://tse3.mm.bing.net/th/id/OIP.TrSrfZTq7DfBn-Hi-m7k-gHaEo?pid=Api&P=0&h=180);
    }
    #box5{
        background-image: url(https://wallpapercave.com/wp/wp4590037.jpg);
    }
    #box6{
        background-image: url(https://wallpapercave.com/wp/wp4179932.jpg);
    }
    #box7{
        background-image: url(https://cdn.wallpapersafari.com/98/83/rsA1CO.jpg);
    }
    #box8{
        background-image: url(https://wallpaperaccess.com/full/3127733.jpg);
    }
    .hero>p{
        width: 60px;
        height: 20px;
        border: 1px solid white;
        color: white;
        
    }
    #iron{
        color: aliceblue;
    }
    
    #hero2{
        margin-bottom:100px;
    }
    #im{
        margin-right: 100px;
    }
    
    .hero:hover{
        width: 60px;
        background-color: green;
    }
</style>

<body style="background-color: rgb(44, 44, 105);">

    <section id="headsection">
        <!-- For Header -->
    </section>

    <div id="head_para">
        <h1>Avengers</h1>
        <p> Earth Mightiest Heroes!</p>
    </div>

    <section id="section2">

        <div class="mainbox">
            <div class="box" id="box1">
                <div class="hero" id="hero1"><p>HERO</p></div>
                <div class="content"><p id="iron">IRON MAN</p></div>
            </div>
            <div class="box" id="box2">
                <div class="hero" id="hero1"><p>HERO</p></div>
                <div class="content"><p id="iron">CAPTAIN AMERICA</p></div>
            </div>
            <div class="box" id="box3">
                <div class="hero" id="hero1"><p>HERO</p></div>
                <div class="content" id="im"><p id="iron">HULK</p></div>
            </div>
              
            <div class="box" id="box4">
                <div class="hero" id="hero1"><p>HERO</p></div>
                <div class="content"><p id="iron">HAWKEYE</p></div>
            </div>
              
            <div class="box" id="box5">
                <div class="hero" id="hero1"><p>HERO</p></div>
                <div class="content"><p id="iron">BLACK WIDOW</p></div>
            </div>
             
            <div class="box" id="box6">
                <div class="hero" id="hero1"><p>HERO</p></div>
                <div class="content"><p id="iron">THOR</p></div>
            </div>
             
            <div class="box" id="box7">
                <div class="hero" id="hero1"><p>HERO</p></div>
                <div class="content"><p id="iron">SPIDER MAN</p></div>
            </div>
             
            <div class="box" id="box8">
                <div class="hero" id="villain"><p>VILLAIN</p></div>
                <div class="content"><p id="iron">ULTRON</p></div>
            </div>
        </div>

    </section>


    
    
</body>
</html>
