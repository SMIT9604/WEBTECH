<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List Styling</title>
    <style>
        ul{
            border: 2px solid red;
        }
        li{
            border: 2px solid blue;
            list-style: decimal;
            list-style-position: outside;
        }
    </style>
</head>
<body>
    <h1>CSS List Styling</h1>
    <ul>
        <li>Shubman Gill</li>
        <li>Virat Kohli</li>
        <li>Rohit Sharma </li>
        <li>Hardik Pandya </li>
    </ul>
</body>
</html>
