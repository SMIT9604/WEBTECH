<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width: 400px;
            height: 400px;
            border: 2px solid gray;
            background-color: chocolate;
            animation:convertCircle 3s linear 2 forwards;
        }
        @keyframes convertCircle{
            from{
                border-radius: 0%;
            }
            to{
                border-radius: 50%;
            }
        }
    </style>
</head>
<body>
    <h1>Animations in CSS</h1>
    <div class="box"></div>
</body>
</html>
