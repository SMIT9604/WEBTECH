<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Areas Task-1</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        .parent{
            width: 100%;
            height: 100vh;
            background-color: black;
            border: 1px solid wheat;
            display: grid;
            grid-template-areas:
            "head head head head"
            "side side side2 side2"
             "side side side2 side2"
             "sec sec sec sec" 
             "sec sec sec sec"
             "main main main main"
             "foot foot foot foot";
        }
        .child{
        background-color: wheat;
        padding: 20px;
        border:1px solid black;
        display: flex;
        justify-content: center;
        align-items: center;
        }
     #item1{
        grid-area: head;
     }
     #item2{
        grid-area: side;
     }
     #item3{
        grid-area: side2;
     }
     #item4{
        grid-area: sec;
     }
     #item5{
        grid-area: main;
     }
     #item6{
        grid-area: foot;
     }
    </style>
</head>
<body>
    <section class="parent">
        <div class="child" id="item1">Header</div>
        <div class="child" id="item2">Aside-1</div>
        <div class="child" id="item3">Aside-2</div>
        <div class="child" id="item4">Section</div>
        <div class="child" id="item5">Main</div>
        <div class="child" id="item6">Footer</div>
    </section>
</body>
</html>
