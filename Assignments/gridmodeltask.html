<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Model Task-1</title>
    <style>
        *{
            padding: 0%;
            margin: 0%;
            box-sizing: border-box;
        }
        .parent{
            width: 100%;
            height: 100vh;
            display: grid;
            background-color: black;
            border: 2px solid  wheat;
            grid-template-columns: repeat(4,1fr);
            position: absolute;
           
        }
        .child{
            border: 2px solid white;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        #item1{
            grid-row: 1/3;
        }
        #item2{
            grid-column: 2/4;
        }
        #item3{
            grid-column: 4;
            grid-row: 1/3;
        }
        #item4{
            grid-column: 2/4;
            
        }
        #item5{
            grid-column: 1/3;
        }
        #item6{
        
            grid-column: 3/5 ;
        }* {
    padding: 0;
    margin: 0;
    box-sizing: border-box;
}

.parent {
    width: 100%;
    height: 100vh;
    display: grid;
    background-color: black;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(3, 1fr); 
    gap: 10px;
    padding: 10px;
}

.child {
    border: 1px solid ;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden; 
}


.child img {
    width: 100%;
    height: 100%;
    
}


#item1 {
    grid-column: 1 / 2;
    grid-row: 1 / 3;
}

#item2 {
    grid-column: 2 / 4;
    grid-row: 1 / 2;
}

#item3 {
    grid-column: 4 / 5;
    grid-row: 1 / 3;
}

#item4 {
    grid-column: 2 / 4;
    grid-row: 2 / 3;
    background-image: url(https://justbaazaar.com/wp-content/uploads/2025/03/Rohit-Sharma-Leads-India-to-Champions-Trophy-Glory.jpeg);
    background-size: cover;
    
    
}

#item5 {
    grid-column: 1 / 3;
    grid-row: 3 / 4;
}

#item6 {
    grid-column: 3 / 5;
    grid-row: 3 / 4;
    flex-direction: column;
    text-align: center;
    background-image: url(https://png.pngtree.com/thumb_back/fh260/background/20231017/pngtree-icc-cricket-world-match-background-image_13943187.jpg);
    background-size: cover;
}
h3{
    font-size: 50px;
}
h1{
    font-size: 50px;
    
}


    </style>
</head>
<body>
    <div class="parent">
        <div class="child" id="item1">
            <img src="https://w0.peakpx.com/wallpaper/233/967/HD-wallpaper-virat-kohli-angry-look-king-kohli-indian-cricketer.jpg" width="100%" height="100%" alt="">
        </div>

        <div class="child" id="item2">
            <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjH-HkoMiEMsP3XQ1WmcExRO5AhlBEo0OkBywORGY1U4M8v492I3trJZztrAZObzRawvIK8Yf5acQY_uoHxN6WfdAUksUJIBfeyGKN6ejDWON18lMUWw1oQ4jdCyt1yt1Hg33BlRw8bqwbMKhxzFtvEIk84vu9xT4T5klF34sP9FrOi41KPM6ms433CnUJt/s4800/rohit_sharma_1572353374.jpg" width="100%" height="" alt="">
        </div>

        <div class="child" id="item3">
            <img src="https://www.bollywoodshaadis.com/img/article-20231132018130365583000.jpg" width="100%" height="100%" alt="">
        </div>

        <div class="child" id="item4">
            <h1></h1>
        </div>

        <div class="child" id="item5"><img src="https://api.bdcrictime.com/jasprit-bumrahtdg-09_07_2024.jpg" width="100%" height="100%" alt="">
        </div>

        <div class="child" id="item6">
            <h3 style="color: white;">#Task 4</h3>
            <br>
            <p style="color: white;"> Responsive image Gallery Using CSS Grid</p>
        </div>
    </div>
</body>
</html>
