<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            background-color: black;
            color: wheat;
        }
        .earth{
            height: 400px;
            width: 400px;
            border-radius: 50%;
            margin: 50px auto;
            background-image: url(https://images.pexels.com/photos/2422/sky-earth-galaxy-universe.jpg?cs=srgb&dl=astronomy-discovery-earth-2422.jpg&fm=jpg);
            background-size: 130%;
            background-position: center;
            animation: rotate 4s linear infinite;
        }
        @keyframes rotate{
            from{
                transform: rotate(0deg);
            }
            to{
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <h1>Earth Rotating using Animations in CSS</h1>
        <div class="earth"></div>
</body>
</html>
