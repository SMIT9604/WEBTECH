<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        .box{
            width: 400px;
            height: 250px;
        }
        #box1{
            background-color: red;
            position: static;
            left: 50px;
        }
        #box2{
            background-color: blue;
            position: relative;
            right: 10px;
            bottom: 50px;
        }
    </style>
</head>
<body>
    <h1>Static and  Relative positions in CSS</h1>
    <div class="box" id="box1">Box-1</div>
    <div class="box" id="box2">Box-2</div>
</body>
</html>
