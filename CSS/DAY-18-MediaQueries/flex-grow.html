<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7 Wonders of World</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        body{
            background-color: black;
            color: white;
        }
        h1{
            text-align: center;
        }
        .parent{
            width: 90%;
            height: 90vh;       
            margin: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        .child{
            width: 10%;
            height: 80vh;
            border-radius: 10px;
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            transition: all 0.5s linear;
            overflow: hidden;
        }
        .child:hover{
            flex-grow: 1;
            transform:scale(1.1);
            transform: translate(20px 20px);
            h2{
                transform: translateY(0px);
            }
        }
        .child:nth-child(1){
            background-image: url(https://cdn.thecollector.com/wp-content/uploads/2022/11/panoramic-interior-of-roman-colosseum.jpg?width=1200&quality=100&dpr=2);
        }
         .child:nth-child(2){
            background-image: url(https://cdn.thecollector.com/wp-content/uploads/2021/12/great-wall-china-national-geographic.jpg?width=1200&quality=100&dpr=2);
        }
         .child:nth-child(3){
            background-image: url(https://cdn.thecollector.com/wp-content/uploads/2021/12/the-taj-mahal-architectural-digest.jpg?width=1200&quality=100&dpr=2);
        }
         .child:nth-child(4){
            background-image: url(https://cdn.thecollector.com/wp-content/uploads/2021/12/christ-the-redeemer-statue-rio-1-scaled.jpg?width=1200&quality=100&dpr=2);
        }
         .child:nth-child(5){
            background-image: url(https://cdn.thecollector.com/wp-content/uploads/2021/12/machu-picchu-world-wonder.jpg?width=1095&quality=100&dpr=2);
        }
         .child:nth-child(6){
            background-image: url(https://cdn.thecollector.com/wp-content/uploads/2025/01/temple-condor-machu-picchu.jpg?width=1200&quality=100&dpr=2);
        }
         .child:nth-child(7){
            background-image: url(https://cdn.thecollector.com/wp-content/uploads/2022/12/petra-jordan-treasury-al-khazneh.jpg?width=1200&quality=100&dpr=2);
        }
        h2{
            color: black;   
        }
        .child h2{
            color: black;
            margin-top: 10px;
            text-align: center;
            font-weight: 600;
            transform: translateY(-100px);
            transition: all 0.5s linear;
        }

    </style>
</head>
<body>
    <section>
        <div><h1>7 Wonders of World</h1></div>
        <div class="parent">
            <div class="child"><h2>Colosseum</h2></div>
            <div class="child"><h2>The Great Wall of China</h2></div>
            <div class="child"><h2>Taj Mahal</h2></div>
            <div class="child"><h2>Christ The Redeemer</h2></div>
            <div class="child"><h2>ChiChen</h2></div>
            <div class="child"><h2>Machhu Pichhu</h2></div>
            <div class="child"><h2>Petra</h2></div>
        </div>
    </section>
</body>
</html>
