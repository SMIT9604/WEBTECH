<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Translation in CSS</title>
    <style>
        .box{
            width: 200px;
            height: 100px;
            margin: 30px;
            border: 1px solid;
            background-color: red;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .box:hover{
            transform: translate(10px,20px);
        }
        .box1{
            width: 100px;
            height: 50px;
            margin: 30px;
            border: 1px solid;
            background-color: blue;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .box1:hover{
            transform: translate(50px,-100px);
        }
    </style>
</head>
<body>
    <h1> CSS Transformation - translate property</h1>
    <div class="box">Box</div>
    <div class="box1">Box-1</div>
    
</body> 
</html>
