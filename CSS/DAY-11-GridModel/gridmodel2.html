<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent{
            width: 100%;
            border: 2px solid red;
            display: grid;
            grid-template-columns: 20% 20% 20% 20% 20%;
            gap: 10px;
            align-content: space-evenly;
        }
        .main{
            width: 200px;
            height: 100px;
            border: 2px solid black;
            text-align: center;
            justify-content: center;
            align-content: center;
        }
    </style>
</head>
<body>
    <section class="parent">
        <div class="main" id="box1">Grid-1</div>
        <div class="main" id="box2">Grid-2</div>
        <div class="main" id="box3">Grid-3</div>
        <div class="main" id="box4">Grid-4</div>
        <div class="main" id="box5">Grid-5</div>
        <div class="main" id="box6">Grid-6</div>
        <div class="main" id="box7">Grid-7</div>
        <div class="main" id="box8">Grid-8</div>
        <div class="main" id="box9">Grid-9</div>
        <div class="main" id="box10">Grid-10</div>
        <div class="main" id="box11">Grid-11</div>
        <div class="main" id="box12">Grid-12</div>
        <div class="main" id="box13">Grid-13</div>
        <div class="main" id="box14">Grid-14</div>
        <div class="main" id="box15">Grid-15</div>
        <div class="main" id="box16">Grid-16</div>
        <div class="main" id="box17">Grid-17</div>
        <div class="main" id="box18">Grid-18</div>
        <div class="main" id="box19">Grid-19</div>
        <div class="main" id="box20">Grid-20</div>
    </section>
</body>
</html>
