<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        .parent{
            padding: 20px;
            width: 100%;
            height: 100vh;
            display: grid;
            justify-content:center ;
            background-color: black;
            color: wheat;
            border: 2px solid wheat;
            grid-template-columns: repeat(3,1fr);
            grid-template-rows: repeat(4,1fr);
            gap: 10px;
        }
        .child{
           
            border: 2px solid white;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #item1{
            grid-column: 1/4;
        }
        #item2{
            grid-row: 2/4;
        }
        #item4{
            grid-column: 3;
            grid-row: 2/4;
        }
        #item6{
            grid-column: 1/4;
        }
    </style>
</head>
<body>
    <section class="parent">
    <div class="child" id="item1"><mark style="background-color: rgb(111, 12, 12);">Header</mark></div>
    <div class="child" id="item2">Aside-1</div>
    <div class="child" id="item3">Section</div>
    <div class="child" id="item4">Aside-2</div>
    <div class="child" id="item5">Main</div>
    <div class="child" id="item6">Footer</div>
    </section>
</body>
</html>
